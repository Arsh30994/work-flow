type: web
name: care-mesh-backend
env: python
plan: free
region: oregon
buildCommand: pip install -r backend/requirements.txt
startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

# Environment variables (set in Render dashboard)
# DATABASE_URL - PostgreSQL connection string
# GEMINI_API_KEY - Google Gemini API key
# ALLOWED_ORIGINS - Comma-separated list of allowed origins for CORS (e.g., https://your-frontend.vercel.app)
# BACKEND_URL - Full URL where this service is reachable (e.g., https://care-mesh-backend.onrender.com)
